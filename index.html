  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      el: "#app",
      name: 'Docsify',
      repo: 'https://gitee.com/myworldggc/DocsifyDoc.git',
      loadSidebar: true, // 启用侧边栏
      subMaxLevel: 5,    // 侧边栏标题层级
      search: 'auto',    // 启用搜索
      // 封面
      coverpage: true,
      // 完整配置参数
      search: {
        maxAge: 86400000, // 过期时间，单位毫秒，默认一天
        paths: [], // or 'auto'
        placeholder: '搜索',

        // 支持本地化
        placeholder: {
          '/zh-cn/': '搜索',
          '/': '搜索'
        },

        noData: 'No Results!',

        // 支持本地化
        noData: {
          '/zh-cn/': '找不到结果',
          '/': 'No Results'
        },

        // 搜索标题的最大层级, 1 - 6
        depth: 2,

        hideOtherSidebarContent: false, // 是否隐藏其他侧边栏内容

        // 避免搜索索引冲突
        // 同一域下的多个网站之间
        namespace: 'website-1',

        // 使用不同的索引作为路径前缀（namespaces）
        // 注意：仅适用于 paths: 'auto' 模式
        //
        // 初始化索引时，我们从侧边栏查找第一个路径
        // 如果它与列表中的前缀匹配，我们将切换到相应的索引
        pathNamespaces: ['/zh-cn', '/ru-ru', '/ru-ru/v1'],

        // 您可以提供一个正则表达式来匹配前缀。在这种情况下，
        // 匹配到的字符串将被用来识别索引
        pathNamespaces: /^(\/(zh-cn|ru-ru))?(\/(v1|v2))?/
      },
      plugins: [

        // EditOnGithubPlugin.create(
        //   'https://gitee.com/myworldggc/DocsifyDoc/master',
        //   null,
        //   function (file) {
        //     if (file.indexOf('en') === -1) {
        //       return '编辑'
        //     } else {
        //       return 'edit on git'
        //     }
        //   }
        // )
      ],
      // 分页配置
      pagination: {
        previousText: '上一章节',
        // or
        nextText: {
          '/en/': 'NEXT',
          '/': '下一章节'
        },
        crossChapter: true,
        crossChapterText: true,
      },
      // 字数统计
      count: {
        countable: true,
        fontsize: '0.9em',
        color: 'rgb(90,90,90)',
        language: 'chinese'
      },
      // // Disqus评论系统支持
      // disqus: 'shortname'
    }
  </script>
